<style>
/* Layout: one narrow column for a phone held at a reception entrance: names header, search, your table, the room. */
:root{
  --bg:#faf5ef; --surface:#fffdfb; --ink:#2a1a1e; --muted:#7a6468; --line:#ead8d3;
  --wine:#721c2b; --wine-ink:#fffaf6; --gold:#b8924a; --blush:#f8e6e7; --pink:#e7b0b8;
  --floor:#fdfaf8; --fixture:#f4ebe4;
  --f-script:"Dancing Script","Brush Script MT",cursive;
  --f-serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1013; --surface:#26161a; --ink:#f5e9ea; --muted:#c3abaf; --line:#43292f;
  --wine:#e6a3b0; --wine-ink:#2a1015; --gold:#d8b673; --blush:#3a2228; --pink:#9a5a67;
  --floor:#221418; --fixture:#301d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1013; --surface:#26161a; --ink:#f5e9ea; --muted:#c3abaf; --line:#43292f;
  --wine:#e6a3b0; --wine-ink:#2a1015; --gold:#d8b673; --blush:#3a2228; --pink:#9a5a67;
  --floor:#221418; --fixture:#301d22; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-serif);font-size:19px;line-height:1.4;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.star{width:22px;height:22px;color:var(--gold)}
h1{font-family:var(--f-script);font-weight:600;color:var(--wine);font-size:clamp(2.6rem,12vw,3.4rem);line-height:1.05;margin:4px 0 0}
.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-weight:700;font-size:.82rem;color:var(--ink)}
.when{font-style:italic;color:var(--muted);font-size:1rem}
.rule{display:flex;align-items:center;gap:10px;width:70%;color:var(--gold);margin:8px 0 4px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.7}
.search{position:relative}
.search label{display:block;font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#q{width:100%;font:600 1.25rem/1.2 var(--f-serif);color:var(--ink);background:var(--surface);border:1.5px solid var(--gold);border-radius:12px;padding:14px 44px 14px 16px;outline:none;-webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#q::placeholder{color:var(--muted);font-weight:500;font-style:italic}
#q:focus-visible{border-color:var(--wine);box-shadow:0 0 0 3px color-mix(in srgb,var(--wine) 22%,transparent)}
#clear{position:absolute;right:8px;bottom:9px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer}
#clear:focus-visible{outline:2px solid var(--wine)}
.hint{color:var(--muted);font-size:.95rem;font-style:italic;text-align:center}
.results{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results h3{margin:0;padding:10px 16px 4px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;cursor:pointer}
.results h3+.res{border-top:0}
.res:hover,.res:focus-visible{background:var(--blush);outline:none}
.res .nm{flex:1;min-width:0;font-size:1.15rem}
.res .nm b{font-weight:700}
.pill{font-weight:700;font-variant-numeric:lining-nums tabular-nums;color:var(--wine);white-space:nowrap;font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.seat{display:flex;align-items:center;gap:16px}
.disc{flex:none;width:86px;height:86px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;font-weight:700;font-size:2.6rem;font-variant-numeric:lining-nums;box-shadow:0 0 0 4px var(--surface),0 0 0 5.5px var(--gold)}
.disc.sw{font-size:1.9rem}
.who{min-width:0}
.who .lbl{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.who .name{font-size:1.6rem;line-height:1.15;font-weight:700;text-wrap:balance}
.who .tbl{font-size:1.1rem;color:var(--wine);font-weight:600}

.mates ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 16px}
.mates li{font-size:1.05rem;min-width:0}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px 10px}
.mapbox h2{margin:0 0 8px;text-align:center;font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.mapbox p{margin:6px 0 0;text-align:center;color:var(--muted);font-size:.92rem;font-style:italic}
svg{display:block;width:100%;height:auto}
.wall{stroke:var(--wine);stroke-width:5;fill:none}
.room{fill:var(--floor)}
.fx{fill:var(--fixture);stroke:var(--gold);stroke-width:2}
.fx.dance{fill:var(--blush)}
.fxl{fill:var(--ink);font:700 22px var(--f-serif);letter-spacing:2px;text-anchor:middle;text-transform:uppercase}
.ent{fill:var(--wine);font:700 22px var(--f-serif);letter-spacing:3px;text-anchor:middle}
.tb{cursor:pointer}
.tb circle{fill:var(--surface);stroke:var(--wine);stroke-width:3.5}
.tb text{fill:var(--wine);font:700 34px var(--f-serif);text-anchor:middle;dominant-baseline:central;font-variant-numeric:lining-nums;pointer-events:none}
.tb.on circle{fill:var(--wine);stroke:var(--gold);stroke-width:5}
.tb.on text{fill:var(--wine-ink)}
.tb:focus-visible circle{stroke:var(--gold);stroke-width:6}
.tb:focus{outline:none}
.halo{fill:none;stroke:var(--gold);stroke-width:4}
.sweet{fill:var(--wine)}
.heart{fill:var(--pink)}
.foot{text-align:center;color:var(--muted);font-size:.95rem;font-style:italic}
@media (prefers-reduced-motion:no-preference){
  .halo{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
}
</style>

  const exact=guests.filter(g=>g.full.includes(qq)||qt.every(t=>g.toks.some(x=>x.startsWith(t))));
  if(exact.length)return{exact:exact.sort(byLast),near:[]};
  if(qq.length<3)return{exact:[],near:[]};
  // close spellings: compare each typed word with each name word
  const scored=guests.map(g=>{let s=0;for(const t of qt){let best=99;for(const x of g.toks){const d=lev(t,x.slice(0,Math.max(t.length,x.length)));if(d<best)best=d}s+=best}return{g,s}});
  const lim=Math.max(1,Math.round(qq.length/4));
  return{exact:[],near:scored.filter(r=>r.s<=lim).sort((a,b)=>a.s-b.s||byLast(a.g,b.g)).slice(0,8).map(r=>r.g)};
}

let selTable=null;
function render(){
  const q=$("q").value; $("clear").hidden=!q;
  const out=$("out");
  if(!q.trim()){out.innerHTML='<p class="hint">Start typing and your name will appear.</p>';return}
  const {exact,near}=search(q);
  if(exact.length===1){showGuest(exact[0]);return}
  const list=exact.length?exact:near;
  if(!list.length){out.innerHTML=`<p class="hint">No one matches “${esc(q.trim())}”. Try just your first name or just your last name.</p>`;setTable(null);return}
  out.innerHTML=`<div class="results"><h3>${exact.length?`${list.length} matches · tap your name`:"Did you mean"}</h3>${list.slice(0,40).map(g=>`<button type="button" class="res" data-i="${g.i}"><span class="nm">${nameHTML(g)}</span><span class="pill">${tableLabel(g.t)}</span></button>`).join("")}</div>`;
  if(list.length>40)out.firstChild.insertAdjacentHTML("beforeend",'<h3>Keep typing to narrow it down</h3>');
  out.querySelectorAll(".res").forEach(b=>b.addEventListener("click",()=>showGuest(guests[+b.dataset.i],true)));
  setTable(null);
}
function card(title,label,t,mates,matesTitle){
  return `<article class="card" id="card"><div class="seat"><div class="disc${t==="S"?" sw":""}" aria-hidden="true">${t==="S"?"♥":esc(t)}</div><div class="who"><div class="lbl">${label}</div><div class="name">${title}</div><div class="tbl">${tableLabel(t)}</div></div></div>${mates.length?`<div class="mates"><h4>${matesTitle}</h4><ul>${mates.map(m=>`<li>${nameHTML(m)}</li>`).join("")}</ul></div>`:""}</article>`;
}
function showGuest(g,scroll){
  const mates=guests.filter(x=>x.t===g.t&&x!==g).sort(byLast);
  $("out").innerHTML=card(nameHTML(g),"Welcome",g.t,mates,"At your table");
  setTable(g.t);
  if(scroll)$("card").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function showTable(t){
  const at=guests.filter(x=>x.t===t).sort(byLast);
  $("out").innerHTML=card(tableLabel(t),"Seated here",t,at,`${at.length} guests`).replace('<div class="tbl">'+tableLabel(t)+'</div>','');
  setTable(t);
  $("card").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}

/* ---------- map ---------- */
const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const tnodes={};
function drawMap(){
  const svg=$("map");
  el("rect",{x:40,y:40,width:1222,height:592,class:"room"},svg);
  el("path",{d:"M40 608 V40 H1262 V632 H870 M770 632 H150",class:"wall"},svg);
  for(const [x,label] of [[95,"ENTRANCE"],[820,"ENTRANCE"]]){
    el("path",{d:`M${x} 640 l-14 22 h28 Z`,fill:"var(--wine)"},svg);
    const t=el("text",{x,y:690,class:"ent"},svg);t.textContent=label;
  }
  for(const f of DATA.fixtures){
    el("rect",{x:f.x,y:f.y,width:f.w,height:f.h,rx:4,class:"fx"+(f.id==="dance"?" dance":"")},svg);
    const words=f.label.toUpperCase().split(" ");
    const tall=f.h>f.w*1.5;
    const g=el("g",{transform:`translate(${f.x+f.w/2} ${f.y+f.h/2})${tall?" rotate(-90)":""}`},svg);
    const lines=(f.id==="dance"||tall||f.id==="booth")?words:[words.join(" ")];
    lines.forEach((w,i)=>{const t=el("text",{x:0,y:(i-(lines.length-1)/2)*26+8,class:"fxl"},g);t.textContent=w;if(f.id==="dance")t.setAttribute("style","font-size:30px")});
  }
  const s=DATA.sweetheart;
  el("rect",{x:s.x-62,y:s.y-17,width:124,height:34,rx:5,class:"sweet"},svg);
  el("path",{d:`M${s.x} ${s.y+10} c-22 -12 -18 -26 -8 -26 c5 0 8 4 8 6 c0 -2 3 -6 8 -6 c10 0 14 14 -8 26Z`,class:"heart"},svg);
  for(const [id,p] of Object.entries(DATA.tables)){
    const g=el("g",{class:"tb",transform:`translate(${p.x} ${p.y})`,tabindex:0,role:"button","aria-label":`Table ${id}`},svg);
    el("circle",{r:38},g);
    const t=el("text",{x:0,y:2},g);t.textContent=id;
    g.addEventListener("click",()=>showTable(id));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showTable(id)}});
    tnodes[id]=g;
  }
}
function setTable(t){
  for(const g of Object.values(tnodes)){g.classList.remove("on");const h=g.querySelector(".halo");if(h)h.remove()}
  selTable=t;
  if(t&&tnodes[t]){const g=tnodes[t];g.classList.add("on");g.insertBefore(el("circle",{r:40,class:"halo"}),g.firstChild);g.parentNode.appendChild(g)}
}

drawMap();
$("q").addEventListener("input",render);
$("form").addEventListener("submit",e=>{e.preventDefault();const b=$("out").querySelector(".res");if(b)b.click();$("q").blur()});
$("clear").addEventListener("click",()=>{$("q").value="";render();$("q").focus()});
render();
})();
</script>
